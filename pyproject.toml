[project]
name = "sevanbnet-backend"
version = "0.1.0"
description = "API, admin and QR redirects for sevanb.net"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework",
    "django-cors-headers",
    "dj-database-url",
    "gunicorn",
    "psycopg[binary]",
    "whitenoise",
    "qrcode[pil]",
    "django-unfold~=0.108.0",
    "django-allauth[mfa]~=65.19.7",
    "django-axes~=8.3",
    "markdown~=3.11",
    "nh3~=0.3.7",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 100
extend-exclude = ["sevanbnet/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
